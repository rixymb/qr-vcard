<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Digital | Ricardo Martinez Barrero</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    boxShadow: {
                        'card': '0 25px 50px -12px rgba(0, 0, 0, 0.12)',
                        'float': '0 12px 30px -5px rgba(0, 0, 0, 0.18)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        /* Arco curvo elegante para la parte inferior de la imagen de cabecera */
        .arch-header-container {
            border-bottom-left-radius: 50% 32px;
            border-bottom-right-radius: 50% 32px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-4 px-3 min-h-screen flex flex-col items-center justify-center pb-28">

    <main class="w-full max-w-[390px] mx-auto my-auto relative">
        
        <div class="w-full bg-white rounded-[36px] shadow-card overflow-hidden border border-slate-100 transition-all duration-300 pb-6">
            
            <!-- Cabecera de foto con proporción vertical y arco inferior -->
            <div class="relative w-full h-80 bg-slate-900 overflow-hidden flex items-center justify-center arch-header-container border-b-4 border-brand-600 shadow-sm">
                <!-- GIF / Imagen animada de cabecera con encuadre y recorte personalizado -->
                <img id="viewAvatarGif" 
                     src="" 
                     alt="Foto de perfil animada" 
                     class="w-full h-full object-cover select-none">

                <!-- Gradiente sutil inferior para dar profundidad y contraste con el arco -->
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/35 via-transparent to-transparent pointer-events-none"></div>
            </div>

            <div class="px-6 pt-5 text-center">
                
                <!-- Nombre y Apellidos -->
                <h1 id="viewFullName" class="text-2xl font-extrabold text-slate-900 tracking-tight">Cargando nombre...</h1>
                
                <!-- Puesto / Cargo -->
                <p id="viewJobTitle" class="text-sm font-semibold text-slate-500 mt-1">Cargando puesto...</p>
                
                <!-- Tagline / Descripción Corta -->
                <p id="viewTagline" class="text-xs font-medium text-slate-400 mt-1 mb-5">Especialista en Soluciones Cloud y Web</p>

                <div class="text-left space-y-4 border-t border-slate-100 pt-5">
                    
                    <!-- Teléfono Móvil -->
                    <a id="linkMobile" href="#" class="flex items-start gap-3.5 p-2 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center shrink-0 group-hover:bg-brand-600 group-hover:text-white transition-colors">
                            <i class="fa-solid fa-mobile-screen-button text-base"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Móvil</span>
                            <span id="textMobile" class="text-sm font-semibold text-slate-800 tracking-wide"></span>
                        </div>
                    </a>

                    <!-- Teléfono Fijo -->
                    <a id="linkLandline" href="#" class="flex items-start gap-3.5 p-2 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 group-hover:bg-slate-700 group-hover:text-white transition-colors">
                            <i class="fa-solid fa-phone text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Teléfono Fijo</span>
                            <span id="textLandline" class="text-sm font-semibold text-slate-800 tracking-wide"></span>
                        </div>
                    </a>

                    <!-- Correo Electrónico -->
                    <a id="linkEmail" href="#" class="flex items-start gap-3.5 p-2 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                            <i class="fa-regular fa-envelope text-base"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Email</span>
                            <span id="textEmail" class="text-sm font-semibold text-slate-800 truncate block"></span>
                        </div>
                    </a>

                    <!-- Dirección y Mapa -->
                    <div class="space-y-2">
                        <a id="linkAddress" href="#" target="_blank" class="flex items-start gap-3.5 p-2 rounded-xl hover:bg-slate-50 transition-colors group">
                            <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-location-dot text-base"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Dirección</span>
                                <span id="textAddress" class="text-sm font-semibold text-slate-800 leading-snug"></span>
                            </div>
                        </a>

                        <!-- Mapa interactivo embebido -->
                        <div class="pl-12 pr-1">
                            <div class="w-full h-32 rounded-2xl overflow-hidden border border-slate-200 shadow-sm relative bg-slate-100">
                                <iframe id="iframeMap" 
                                        width="100%" 
                                        height="100%" 
                                        style="border:0;" 
                                        allowfullscreen="" 
                                        loading="lazy" 
                                        referrerpolicy="no-referrer-when-downgrade"
                                        title="Mapa de localización">
                                </iframe>
                                <a id="btnOpenMap" href="#" target="_blank" class="absolute bottom-2 right-2 bg-white/95 backdrop-blur-sm text-slate-700 hover:text-brand-600 text-[11px] font-semibold px-2.5 py-1 rounded-lg shadow-md border border-slate-200 transition-colors flex items-center gap-1">
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                    <span>Abrir mapa</span>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Enlace para copiar URL -->
                <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-center text-xs text-slate-400">
                    <button onclick="copyCurrentURL()" class="hover:text-brand-600 flex items-center gap-1.5 transition-colors cursor-pointer">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copiar enlace de esta tarjeta</span>
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- Barra inferior flotante fija con botón rápido de llamada y 'Guardar contacto' -->
    <aside class="fixed bottom-4 inset-x-4 max-w-[390px] mx-auto z-40">
        <div class="w-full bg-white/95 backdrop-blur-md border border-slate-200/80 p-2 pl-3 rounded-full shadow-float flex items-center justify-between gap-2">
            
            <!-- Acceso directo teléfono móvil en lado izquierdo -->
            <a id="stickyCallLink" href="#" class="flex items-center gap-2.5 min-w-0 pr-1 group">
                <div class="w-10 h-10 rounded-full bg-blue-50 text-brand-600 flex items-center justify-center shrink-0 group-hover:bg-brand-600 group-hover:text-white transition-all shadow-sm">
                    <i class="fa-solid fa-phone text-sm"></i>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400 line-clamp-1">Teléfono Móvil</span>
                    <span id="stickyMobileText" class="text-xs font-bold text-slate-800 tracking-tight truncate"></span>
                </div>
            </a>

            <!-- Botón directo de Guardar en Agenda (.vcf) -->
            <button id="btnSaveVCard" 
                    onclick="downloadOptimizedVCard()" 
                    class="bg-brand-600 hover:bg-brand-700 active:scale-95 text-white text-xs font-bold py-3 px-4 rounded-full shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0">
                <span>Guardar contacto</span>
                <i class="fa-solid fa-user-plus text-sm"></i>
            </button>
        </div>
    </aside>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 bg-slate-900/95 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 transform -translate-y-10 pointer-events-none flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMsg">Mensaje de notificación</span>
    </div>

    <script>
        /**
         * CONFIGURACIÓN ÚNICA DE DATOS DEL PERFIL
         */
         const profileConfig = {
            firstName: "Ricardo",
            lastName: "Martinez Barrero",
            jobTitle: "Technical Solutions Consultant",
            company: "Google",
            mobile: "+41798495358",
            mobileFormatted: "41798495358",
            landline: "+41798495358",
            landlineFormatted: "+41440000000",
            email: "rixymb@gmail.com",
            street: "Bahnweg 4",
            postalCode: "8142",
            city: "Uitikon",
            country: "Suiza",
            
            // 1. Imagen GIF animada para la visualización web
            webGifUrl: "rixymb_profile_gif.gif",
            // 2. AJUSTE DE RECORTE DEL GIF VERTICAL:
            // "center 38%" o "center 40%" sube el vídeo eliminando exactamente el 25%-30% superior (luces y techo)
            // Valores posibles: 'center 30%', 'center 38%', 'center 45%'
            webGifObjectPosition: "center 38%",

            
            // 2. Foto estática que se procesará e incrustará en la vCard (.vcf)
            localPhotoPath: "rixymb_profile_picture.jpg" // Ruta local alternativa en tu servidor
        };


        // Dirección completa formateada
        function getFullAddress() {
            return `${profileConfig.street}, ${profileConfig.postalCode} ${profileConfig.city}, ${profileConfig.country}`;
        }

        // Renderiza automáticamente los datos del JSON en la interfaz
        function initProfileUI() {
            const fullAddress = getFullAddress();
            const mapSearchUrl = `https://maps.google.com/?q=${encodeURIComponent(fullAddress)}`;

            // Avatar GIF y ajuste de recorte personalizado
            const gifElement = document.getElementById('viewAvatarGif');
            gifElement.src = profileConfig.webGifUrl;
            if (profileConfig.webGifObjectPosition) {
                gifElement.style.objectPosition = profileConfig.webGifObjectPosition;
            }

            // Datos textuales
            document.getElementById('viewFullName').innerText = `${profileConfig.firstName} ${profileConfig.lastName}`;
            document.getElementById('viewJobTitle').innerHTML = `${profileConfig.jobTitle} <span class="text-brand-600 font-semibold">(${profileConfig.company})</span>`;
            document.getElementById('viewTagline').innerText = profileConfig.tagline;
            document.title = `Contacto Digital | ${profileConfig.firstName} ${profileConfig.lastName}`;

            // Teléfono Móvil
            document.getElementById('linkMobile').href = `tel:${profileConfig.mobile}`;
            document.getElementById('textMobile').innerText = profileConfig.mobileFormatted || profileConfig.mobile;

            // Teléfono Fijo
            document.getElementById('linkLandline').href = `tel:${profileConfig.landline}`;
            document.getElementById('textLandline').innerText = profileConfig.landlineFormatted || profileConfig.landline;

            // Email
            document.getElementById('linkEmail').href = `mailto:${profileConfig.email}`;
            document.getElementById('textEmail').innerText = profileConfig.email;

            // Dirección y Mapa
            document.getElementById('linkAddress').href = mapSearchUrl;
            document.getElementById('textAddress').innerText = fullAddress;
            document.getElementById('iframeMap').src = `https://maps.google.com/maps?q=${encodeURIComponent(fullAddress)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('btnOpenMap').href = mapSearchUrl;

            // Barra inferior flotante
            document.getElementById('stickyCallLink').href = `tel:${profileConfig.mobile}`;
            document.getElementById('stickyMobileText').innerText = profileConfig.mobileFormatted || profileConfig.mobile;
        }

        document.addEventListener('DOMContentLoaded', initProfileUI);

        /**
         * Carga la foto estática y la optimiza usando un <canvas> invisible para vCard (.vcf)
         */
        async function getOptimizedPhotoBase64(primaryUrl, fallbackUrl) {
            const urlsToTry = [primaryUrl, fallbackUrl].filter(Boolean);

            for (const url of urlsToTry) {
                try {
                    const base64 = await processImageToJpegBase64(url, 320, 0.82);
                    if (base64) return base64;
                } catch (e) {
                    console.warn(`No se pudo procesar la imagen de ${url}, probando alternativa...`);
                }
            }
            return null;
        }

        function processImageToJpegBase64(src, targetSize = 320, quality = 0.82) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";

                img.onload = () => {
                    try {
                        const canvas = document.createElement("canvas");
                        canvas.width = targetSize;
                        canvas.height = targetSize;
                        const ctx = canvas.getContext("2d");

                        // Recorte centrado (Center-crop) a formato cuadrado
                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;

                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = "high";
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);

                        const dataUrl = canvas.toDataURL("image/jpeg", quality);
                        const cleanBase64 = dataUrl.split(",")[1];
                        resolve(cleanBase64);
                    } catch (err) {
                        console.warn("Fallo al exportar en canvas:", err);
                        resolve(null);
                    }
                };

                img.onerror = () => {
                    resolve(null);
                };

                img.src = src;
            });
        }

        // Genera y descarga el archivo .vcf optimizado dinámicamente
        async function downloadOptimizedVCard() {
            const btn = document.getElementById('btnSaveVCard');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Procesando...</span>`;

            try {
                const photoBase64 = await getOptimizedPhotoBase64( 
                    profileConfig.localPhotoPath
                );

                let vcardParts = [
                    "BEGIN:VCARD",
                    "VERSION:3.0",
                    `N:${profileConfig.lastName};${profileConfig.firstName};;;`,
                    `FN:${profileConfig.firstName} ${profileConfig.lastName}`,
                    `ORG:${profileConfig.company}`,
                    `TITLE:${profileConfig.jobTitle}`,
                    `TEL;TYPE=CELL,VOICE:${profileConfig.mobile}`,
                    `TEL;TYPE=WORK,VOICE:${profileConfig.landline}`,
                    `EMAIL;TYPE=INTERNET,PREF:${profileConfig.email}`,
                    `ADR;TYPE=WORK:;;${profileConfig.street};${profileConfig.city};;${profileConfig.postalCode};${profileConfig.country}`,
                    `URL:${window.location.href}`
                ];

                if (photoBase64) {
                    vcardParts.push(`PHOTO;TYPE=JPEG;ENCODING=b:${photoBase64}`);
                }

                vcardParts.push("END:VCARD");

                const vcardString = vcardParts.join("\r\n");

                const blob = new Blob([vcardString], { type: "text/vcard;charset=utf-8;" });
                const downloadUrl = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.setAttribute("download", `Contacto_${profileConfig.firstName}_${profileConfig.lastName}.vcf`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(downloadUrl);
                showToast("¡Contacto listo con foto para guardar!");
            } catch (err) {
                console.error(err);
                showToast("Error al generar el contacto");
            } finally {
                btn.innerHTML = originalHTML;
            }
        }

        // Copiar URL actual al portapapeles
        function copyCurrentURL() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("Enlace copiado al portapapeles");
        }

        // Mostrar notificación tipo Toast
        function showToast(msg) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            toastMsg.innerText = msg;
            
            toast.classList.remove("opacity-0", "-translate-y-10", "pointer-events-none");
            toast.classList.add("opacity-100", "translate-y-0");

            setTimeout(() => {
                toast.classList.add("opacity-0", "-translate-y-10", "pointer-events-none");
                toast.classList.remove("opacity-100", "translate-y-0");
            }, 3000);
        }
    </script>
</body>
</html>
