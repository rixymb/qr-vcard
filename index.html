<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Digital | Tarjeta de Perfil</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    boxShadow: {
                        'card': '0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 15px rgba(0,0,0,0.03)',
                        'avatar': '0 10px 25px -5px rgba(37, 99, 235, 0.25)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .avatar-ring {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            padding: 4px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-6 px-4 min-h-screen flex flex-col items-center justify-center">

    <!-- Contenedor central estilo tarjeta móvil -->
    <main class="w-full max-w-[390px] mx-auto my-auto">
        
        <div class="w-full bg-white rounded-[32px] shadow-2xl overflow-hidden border border-slate-100 transition-all duration-300">
            
            <!-- Cabecera decorativa superior -->
            <div class="h-28 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 relative">
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:12px_12px]"></div>
            </div>

            <!-- Cuerpo de la tarjeta de perfil -->
            <div class="px-6 pb-8 pt-0 relative -mt-16 text-center">
                
                <!-- Avatar Animado (Cargado dinámicamente) -->
                <div class="relative inline-block mb-3">
                    <div class="avatar-ring rounded-full shadow-avatar inline-block">
                        <img id="viewAvatarGif" 
                             src="" 
                             alt="Avatar Animado Web" 
                             class="w-28 h-28 rounded-full object-cover bg-white border-4 border-white shadow-inner">
                    </div>
                    <span class="absolute bottom-2 right-2 w-5 h-5 bg-emerald-500 border-2 border-white rounded-full" title="Disponible"></span>
                </div>

                <!-- Nombre y Cargo (Cargados dinámicamente) -->
                <h1 id="viewFullName" class="text-xl font-bold text-slate-900 tracking-tight">Cargando nombre...</h1>
                <p id="viewJobTitle" class="text-sm font-medium text-slate-500 mt-1 mb-6">Cargando puesto...</p>

                <!-- Botón principal: Añadir a contactos con vCard optimizada -->
                <button id="btnSaveVCard" 
                        onclick="downloadOptimizedVCard()" 
                        class="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold py-3.5 px-5 rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2.5 transition-all duration-200 active:scale-[0.98] cursor-pointer group">
                    <i class="fa-solid fa-user-plus text-lg group-hover:scale-110 transition-transform"></i>
                    <span class="text-base">Añadir a contactos</span>
                </button>

                <!-- Lista de datos de contacto con iconos -->
                <div class="mt-8 text-left space-y-4 border-t border-slate-100 pt-6">
                    
                    <!-- Teléfono Móvil -->
                    <a id="linkMobile" href="#" class="flex items-start gap-4 p-2.5 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-10 h-10 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center shrink-0 group-hover:bg-brand-600 group-hover:text-white transition-colors">
                            <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Móvil</span>
                            <span id="textMobile" class="text-sm font-semibold text-slate-800 tracking-wide"></span>
                        </div>
                    </a>

                    <!-- Teléfono Fijo -->
                    <a id="linkLandline" href="#" class="flex items-start gap-4 p-2.5 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 group-hover:bg-slate-700 group-hover:text-white transition-colors">
                            <i class="fa-solid fa-phone text-base"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Teléfono Fijo</span>
                            <span id="textLandline" class="text-sm font-semibold text-slate-800 tracking-wide"></span>
                        </div>
                    </a>

                    <!-- Correo Electrónico -->
                    <a id="linkEmail" href="#" class="flex items-start gap-4 p-2.5 rounded-xl hover:bg-slate-50 transition-colors group">
                        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                            <i class="fa-regular fa-envelope text-lg"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Email</span>
                            <span id="textEmail" class="text-sm font-semibold text-slate-800 truncate block"></span>
                        </div>
                    </a>

                    <!-- Dirección Postal + Visualización de Mapa -->
                    <div class="space-y-2">
                        <a id="linkAddress" href="#" target="_blank" class="flex items-start gap-4 p-2.5 rounded-xl hover:bg-slate-50 transition-colors group">
                            <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-location-dot text-lg"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Dirección</span>
                                <span id="textAddress" class="text-sm font-semibold text-slate-800 leading-snug"></span>
                            </div>
                        </a>

                        <!-- Mapa interactivo embebido -->
                        <div class="pl-14 pr-2">
                            <div class="w-full h-36 rounded-2xl overflow-hidden border border-slate-200 shadow-sm relative bg-slate-100 group">
                                <iframe id="iframeMap" 
                                        width="100%" 
                                        height="100%" 
                                        style="border:0;" 
                                        allowfullscreen="" 
                                        loading="lazy" 
                                        referrerpolicy="no-referrer-when-downgrade"
                                        title="Mapa de localización">
                                </iframe>
                                <a id="btnOpenMap" href="#" target="_blank" class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm text-slate-700 hover:text-brand-600 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-md border border-slate-200 transition-colors flex items-center gap-1.5">
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                    <span>Abrir mapa</span>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Acción para copiar enlace -->
                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-center gap-3 text-xs text-slate-400">
                    <button onclick="copyCurrentURL()" class="hover:text-brand-600 flex items-center gap-1.5 transition-colors cursor-pointer">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copiar enlace de esta tarjeta</span>
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- Notificación Toast -->
    <div id="toast" class="fixed bottom-6 bg-slate-900 text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 transform translate-y-10 pointer-events-none flex items-center gap-3 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMsg">Mensaje de notificación</span>
    </div>

    <script>
        /**
         * CONFIGURACIÓN ÚNICA DE DATOS DEL PERFIL
         * Modifica este objeto para actualizar de forma centralizada tanto la página web como la vCard (.vcf)
         */
        const profileConfig = {
            firstName: "Ricardo",
            lastName: "Martínez Barrero",
            jobTitle: "Technical Solutions Consultant",
            company: "Google",
            mobile: "+41798495358",
            mobileFormatted: "41798495358",
            landline: "+41798495358",
            landlineFormatted: "+41440000000",
            email: "rixymb@gmail.com",
            street: "Bahnweg 4",
            postalCode: "8142",
            city: "Uitikon",
            country: "Suiza",
            
            // 1. Imagen GIF animada para la visualización web
            webGifUrl: "rixymb_profile_gif.gif",
            
            // 2. Foto estática que se procesará e incrustará en la vCard (.vcf)
            localPhotoPath: "rixymb_profile_picture.jpg" // Ruta local alternativa en tu servidor
        };

        // Función para obtener la dirección completa formateada
        function getFullAddress() {
            return `${profileConfig.street}, ${profileConfig.postalCode} ${profileConfig.city}, ${profileConfig.country}`;
        }

        // Renderiza automáticamente los datos del JSON en la interfaz de la página
        function initProfileUI() {
            const fullAddress = getFullAddress();
            const mapSearchUrl = `https://maps.google.com/?q=${encodeURIComponent(fullAddress)}`;

            // Avatar, Nombre y Puesto
            document.getElementById('viewAvatarGif').src = profileConfig.webGifUrl;
            document.getElementById('viewFullName').innerText = `${profileConfig.firstName} ${profileConfig.lastName}`;
            document.getElementById('viewJobTitle').innerHTML = `${profileConfig.jobTitle} <span class="text-brand-600 font-semibold">(${profileConfig.company})</span>`;
            document.title = `Contacto Digital | ${profileConfig.firstName} ${profileConfig.lastName}`;

            // Teléfono Móvil
            const linkMobile = document.getElementById('linkMobile');
            linkMobile.href = `tel:${profileConfig.mobile}`;
            document.getElementById('textMobile').innerText = profileConfig.mobileFormatted || profileConfig.mobile;

            // Teléfono Fijo
            const linkLandline = document.getElementById('linkLandline');
            linkLandline.href = `tel:${profileConfig.landline}`;
            document.getElementById('textLandline').innerText = profileConfig.landlineFormatted || profileConfig.landline;

            // Email
            const linkEmail = document.getElementById('linkEmail');
            linkEmail.href = `mailto:${profileConfig.email}`;
            document.getElementById('textEmail').innerText = profileConfig.email;

            // Dirección
            const linkAddress = document.getElementById('linkAddress');
            linkAddress.href = mapSearchUrl;
            document.getElementById('textAddress').innerText = fullAddress;

            // Visualización de Mapa embebido
            const iframeMap = document.getElementById('iframeMap');
            iframeMap.src = `https://maps.google.com/maps?q=${encodeURIComponent(fullAddress)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('btnOpenMap').href = mapSearchUrl;
        }

        // Ejecutar inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', initProfileUI);

        /**
         * Carga la foto estática y la optimiza usando un <canvas> invisible
         */
        async function getOptimizedPhotoBase64(primaryUrl, fallbackUrl) {
            const urlsToTry = [primaryUrl, fallbackUrl].filter(Boolean);

            for (const url of urlsToTry) {
                try {
                    const base64 = await processImageToJpegBase64(url, 320, 0.82);
                    if (base64) return base64;
                } catch (e) {
                    console.warn(`No se pudo procesar la imagen de ${url}, probando alternativa...`);
                }
            }
            return null;
        }

        function processImageToJpegBase64(src, targetSize = 320, quality = 0.82) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";

                img.onload = () => {
                    try {
                        const canvas = document.createElement("canvas");
                        canvas.width = targetSize;
                        canvas.height = targetSize;
                        const ctx = canvas.getContext("2d");

                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;

                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = "high";
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);

                        const dataUrl = canvas.toDataURL("image/jpeg", quality);
                        const cleanBase64 = dataUrl.split(",")[1];
                        resolve(cleanBase64);
                    } catch (err) {
                        console.warn("Fallo al exportar en canvas:", err);
                        resolve(null);
                    }
                };

                img.onerror = () => {
                    resolve(null);
                };

                img.src = src;
            });
        }

        // Genera y descarga el archivo .vcf optimizado dinámicamente desde profileConfig
        async function downloadOptimizedVCard() {
            const btn = document.getElementById('btnSaveVCard');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-lg"></i><span>Preparando contacto...</span>`;

            try {
                const photoBase64 = await getOptimizedPhotoBase64( 
                    profileConfig.localPhotoPath
                );

                let vcardParts = [
                    "BEGIN:VCARD",
                    "VERSION:3.0",
                    `N:${profileConfig.lastName};${profileConfig.firstName};;;`,
                    `FN:${profileConfig.firstName} ${profileConfig.lastName}`,
                    `ORG:${profileConfig.company}`,
                    `TITLE:${profileConfig.jobTitle}`,
                    `TEL;TYPE=CELL,VOICE:${profileConfig.mobile}`,
                    `TEL;TYPE=WORK,VOICE:${profileConfig.landline}`,
                    `EMAIL;TYPE=INTERNET,PREF:${profileConfig.email}`,
                    `ADR;TYPE=WORK:;;${profileConfig.street};${profileConfig.city};;${profileConfig.postalCode};${profileConfig.country}`,
                    `URL:${window.location.href}`
                ];

                if (photoBase64) {
                    vcardParts.push(`PHOTO;TYPE=JPEG;ENCODING=b:${photoBase64}`);
                }

                vcardParts.push("END:VCARD");

                const vcardString = vcardParts.join("\r\n");

                const blob = new Blob([vcardString], { type: "text/vcard;charset=utf-8;" });
                const downloadUrl = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.setAttribute("download", `Contacto_${profileConfig.firstName}_${profileConfig.lastName}.vcf`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(downloadUrl);
                showToast("¡Contacto listo con foto para guardar!");
            } catch (err) {
                console.error(err);
                showToast("Error al generar el contacto");
            } finally {
                btn.innerHTML = originalHTML;
            }
        }

        // Copiar URL actual al portapapeles
        function copyCurrentURL() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("Enlace copiado al portapapeles");
        }

        // Mostrar notificación tipo Toast
        function showToast(msg) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            toastMsg.innerText = msg;
            
            toast.classList.remove("opacity-0", "translate-y-10", "pointer-events-none");
            toast.classList.add("opacity-100", "translate-y-0");

            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-10", "pointer-events-none");
                toast.classList.remove("opacity-100", "translate-y-0");
            }, 3000);
        }
    </script>
</body>
</html>
